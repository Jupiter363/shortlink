worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    sendfile on;
    tcp_nopush on;
    server_tokens off;

    # The legacy logout API accepts its token in the query string; never log arguments.
    log_format relay '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
    access_log /var/log/nginx/access.log relay;
    error_log /var/log/nginx/error.log warn;

    upstream shortlink_apisix {
        server apisix:9080;
        keepalive 32;
    }

    server {
        listen 80 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Admin admits at most 8 MiB for the dedicated batch endpoint.
        client_max_body_size 8m;
        client_body_timeout 5s;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;

        # Vite emits content-hashed files under /assets; a new build gets new URLs.
        location ^~ /assets/ {
            try_files $uri =404;
            access_log off;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options nosniff always;
        }

        location = /index.html {
            try_files $uri =404;
            expires -1;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header X-Frame-Options DENY always;
        }

        # Admin -> Agent has a 45 s read budget and APISIX closes at 50 s.
        location = /api/short-link/admin/v1/agent/chat {
            proxy_pass http://shortlink_apisix;
            proxy_http_version 1.1;
            proxy_set_header Host admin.local.test;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Real-IP "";
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_connect_timeout 2s;
            proxy_send_timeout 10s;
            proxy_read_timeout 55s;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header X-Frame-Options DENY always;
            expires off;
        }

        # Exports are bounded streams; disabling response buffering avoids staging them in Nginx.
        location ~ ^/api/short-link/admin/v1/(?:create/batch/export|batches/[^/]+/export)$ {
            proxy_pass http://shortlink_apisix;
            proxy_http_version 1.1;
            proxy_set_header Host admin.local.test;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Real-IP "";
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_connect_timeout 2s;
            proxy_send_timeout 10s;
            proxy_read_timeout 15s;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header X-Frame-Options DENY always;
            expires off;
        }

        location /api/ {
            proxy_pass http://shortlink_apisix;
            proxy_http_version 1.1;
            proxy_set_header Host admin.local.test;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Real-IP "";
            proxy_request_buffering off;
            proxy_connect_timeout 2s;
            proxy_send_timeout 10s;
            proxy_read_timeout 15s;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header X-Frame-Options DENY always;
            expires off;
        }

        location / {
            try_files $uri $uri/ /index.html;
            expires -1;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header X-Frame-Options DENY always;
        }
    }
}
