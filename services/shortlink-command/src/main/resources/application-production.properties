# Start with --spring.profiles.active=production --spring.config.location=classpath:application-production.properties
# Required credentials are supplied by the environment. Do not reuse test credentials.
spring.application.name=shortlink-command
spring.task.scheduling.pool.size=4
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.forward-headers-strategy=none
server.max-http-request-header-size=16KB
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.server.address=127.0.0.1
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=1500
spring.datasource.hikari.data-source-properties.connectTimeout=1500
spring.datasource.hikari.data-source-properties.socketTimeout=5000
server.tomcat.threads.max=64
server.tomcat.threads.min-spare=4
server.tomcat.accept-count=32
server.tomcat.max-connections=256
server.tomcat.connection-timeout=2s
server.tomcat.max-swallow-size=0B
spring.cloud.discovery.enabled=false
spring.cloud.nacos.discovery.enabled=false
spring.cloud.nacos.config.enabled=false
server.port=8001
management.server.port=8101
shortlink.database.url=${BUSINESS_DB_URL}
shortlink.database.username=${BUSINESS_DB_USERNAME}
shortlink.database.password=${BUSINESS_DB_PASSWORD}
shortlink.database.catalog=${BUSINESS_DB_CATALOG}
shortlink.internal-token=${INTERNAL_TOKEN}
shortlink.default-domain=${SHORTLINK_DEFAULT_DOMAIN}
shortlink.domains=${SHORTLINK_ALLOWED_DOMAINS}
shortlink.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
# One slot covers durable claim, bounded send queue, broker wait and SQL acknowledgement.
shortlink.outbox.poll-ms=25
shortlink.outbox.batch-size=64
shortlink.outbox.max-in-flight=64
shortlink.outbox.send-workers=4
shortlink.outbox.ack-workers=4
# Bound each acknowledgement transaction; keep producer callbacks free of database work.
shortlink.outbox.ack-batch-size=16
shortlink.outbox.ack-batch-linger-ms=2
shortlink.outbox.ack-timeout-ms=12000
shortlink.outbox.lease-ms=30000
shortlink.outbox.shutdown-ms=5000
shortlink.outbox.db-timeout-seconds=3
shortlink.id.fixed-key-hex=${SHORTCODE_FIXED_KEY_HEX}
shortlink.id.dynamic-step-enabled=false
shortlink.id.initial-step=10000
shortlink.id.min-step=10000
shortlink.id.max-step=1000000
shortlink.batch.object.endpoint=${OBJECT_ENDPOINT}
shortlink.batch.object.access-key=${IMPORT_ACCESS_KEY}
shortlink.batch.object.secret-key=${IMPORT_SECRET_KEY}
shortlink.batch.object.bucket=${IMPORT_BUCKET}
shortlink.metadata.workers=4
shortlink.metadata.fetch-concurrency=8
shortlink.metadata.fetch-timeout-millis=4000
shortlink.metadata.max-body-bytes=1048576
shortlink.batch.workers=4
shortlink.batch.chunk-rows=200

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai

# Drain the fixed 1.25s membership lease outside request/worker threads. Match upstream deadlines.
shortlink.membership.publication.max-pending=${ROUTE_PUBLICATION_MAX_PENDING:64}
shortlink.membership.publication.workers=${ROUTE_PUBLICATION_WORKERS:4}
shortlink.membership.publication.deadline-millis=${ROUTE_PUBLICATION_DEADLINE_MS:4000}
spring.mvc.async.request-timeout=5s
