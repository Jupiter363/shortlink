# Start with --spring.profiles.active=production --spring.config.location=classpath:application-production.properties
# Required credentials are supplied by the environment. Do not reuse test credentials.
spring.application.name=analytics-worker
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.forward-headers-strategy=none
server.max-http-request-header-size=16KB
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.server.address=127.0.0.1
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=1500
spring.datasource.hikari.data-source-properties.connectTimeout=1500
spring.datasource.hikari.data-source-properties.socketTimeout=5000
server.tomcat.threads.max=64
server.tomcat.threads.min-spare=4
server.tomcat.accept-count=32
server.tomcat.max-connections=256
server.tomcat.connection-timeout=2s
server.tomcat.max-swallow-size=8MB
spring.cloud.discovery.enabled=false
spring.cloud.nacos.discovery.enabled=false
spring.cloud.nacos.config.enabled=false
server.port=8012
management.server.port=8112
analytics.internal-token=${INTERNAL_TOKEN}
analytics.command.url=${COMMAND_URL:http://127.0.0.1:8001}
analytics.clickhouse.urls=${CLICKHOUSE_REPLICA_URLS}
analytics.clickhouse.user=${CLICKHOUSE_USERNAME}
analytics.clickhouse.password=${CLICKHOUSE_PASSWORD}
analytics.clickhouse.database=${CLICKHOUSE_DATABASE}
analytics.producer-quality.urls=${REDIRECT_QUALITY_URLS}
spring.datasource.url=${ANALYTICS_CONTROL_DB_URL}
spring.datasource.username=${ANALYTICS_CONTROL_DB_USERNAME}
spring.datasource.password=${ANALYTICS_CONTROL_DB_PASSWORD}
analytics.kafka.bootstrap=${KAFKA_BOOTSTRAP_SERVERS}
analytics.hash-key=${ANALYTICS_HASH_KEY}
analytics.s3.endpoint=${OBJECT_ENDPOINT}
analytics.s3.access-key=${ARCHIVE_ACCESS_KEY}
analytics.s3.secret-key=${ARCHIVE_SECRET_KEY}
analytics.s3.bucket=${ARCHIVE_BUCKET}
# Explicit immutable-build dimension replay; never mutate archived event interpretations.
analytics.rebuild.enrich-dimensions=${ANALYTICS_REBUILD_ENRICH_DIMENSIONS:false}
