# Start with --spring.profiles.active=production --spring.config.location=classpath:application-production.properties
# Required credentials are supplied by the environment. Do not reuse test credentials.
spring.application.name=shortlink-redirect
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.forward-headers-strategy=none
server.max-http-request-header-size=16KB
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.server.address=127.0.0.1
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=1500
spring.datasource.hikari.data-source-properties.connectTimeout=1500
spring.datasource.hikari.data-source-properties.socketTimeout=5000
server.tomcat.threads.max=64
server.tomcat.threads.min-spare=4
server.tomcat.accept-count=32
server.tomcat.max-connections=256
server.tomcat.connection-timeout=2s
server.tomcat.max-swallow-size=8MB
spring.cloud.discovery.enabled=false
spring.cloud.nacos.discovery.enabled=false
spring.cloud.nacos.config.enabled=false
server.port=8003
management.server.port=8103
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=150ms
spring.data.redis.connect-timeout=1s
spring.datasource.url=${BUSINESS_DB_URL}
spring.datasource.username=${REDIRECT_DB_USERNAME}
spring.datasource.password=${REDIRECT_DB_PASSWORD}
shortlink.redirect.instance-id=${REDIRECT_INSTANCE_ID}
shortlink.redirect.allowed-hosts=${SHORTLINK_ALLOWED_DOMAINS}
shortlink.redirect.trusted-proxy-cidrs=${APISIX_CIDRS}
shortlink.redirect.internal-token=${INTERNAL_TOKEN}
shortlink.redirect.risk-hash-salt=${ANALYTICS_HASH_KEY}
shortlink.redirect.command-base-url=${COMMAND_URL:http://127.0.0.1:8001}
shortlink.redirect.kafka-bootstrap=${KAFKA_BOOTSTRAP_SERVERS}
shortlink.redirect.authority-ttl-millis=1000
# Cached route/policy proofs must retain more than this full processing budget.
shortlink.redirect.request-timeout-millis=500
# Route and policy authority are serial on a cold link. Keep each I/O bounded at 500ms while
# allowing both stages to finish before the 1000ms authority proof expires.
shortlink.redirect.end-to-end-timeout-millis=900
shortlink.redirect.origin-concurrency=16
shortlink.redirect.cluster-origin-rate=200
shortlink.redirect.kafka-queue-capacity=1000
shortlink.redirect.kafka-queue-bytes=8388608
# OFF by default until all creators register and an explicit baseline is certified.
# The authoritative control row must also be ENFORCE before any local negative can deny.
shortlink.redirect.membership.enabled=${ROUTE_MEMBERSHIP_ENABLED:false}
shortlink.redirect.membership.expected-insertions=${ROUTE_MEMBERSHIP_CAPACITY:1000000}
shortlink.redirect.membership.maximum-memory-bytes=${ROUTE_MEMBERSHIP_MEMORY_BYTES:33554432}
shortlink.redirect.membership.kafka-hints-enabled=${ROUTE_MEMBERSHIP_KAFKA_HINTS:true}
shortlink.redirect.membership.snapshot-path=${ROUTE_MEMBERSHIP_SNAPSHOT_PATH:}
spring.codec.max-in-memory-size=16KB
