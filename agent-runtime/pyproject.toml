[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shortlink-agent-runtime"
version = "0.7.0"
description = "AgentScope-based Python runtime for the shortlink agent platform."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "agentscope[service,storage]==2.0.4.post1",
    "fastapi>=0.116,<1.0",
    "httpx>=0.28,<1.0",
    "pyjwt[crypto]>=2.10,<3.0",
    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.0,<3.0",
    "jsonschema>=4.25,<5.0",
    "pytest>=8.4,<9.0",
    "pytest-asyncio>=1.1,<2.0",
    "ruff>=0.12,<1.0",
    "uv==0.11.29",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
