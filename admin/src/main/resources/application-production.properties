# Start with --spring.profiles.active=production --spring.config.location=classpath:application-production.properties
# Required credentials are supplied by the environment. Do not reuse test credentials.
spring.application.name=admin
spring.task.scheduling.pool.size=2
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.forward-headers-strategy=none
server.max-http-request-header-size=16KB
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.server.address=127.0.0.1
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=1500
spring.datasource.hikari.data-source-properties.connectTimeout=1500
spring.datasource.hikari.data-source-properties.socketTimeout=5000
server.tomcat.threads.max=64
server.tomcat.threads.min-spare=4
server.tomcat.accept-count=32
server.tomcat.max-connections=256
server.tomcat.connection-timeout=2s
# Separate idle keep-alive reuse from the initial request read budget.
server.tomcat.keep-alive-timeout=15s
server.tomcat.max-keep-alive-requests=100
server.tomcat.max-swallow-size=0B
spring.cloud.discovery.enabled=false
spring.cloud.nacos.discovery.enabled=false
spring.cloud.nacos.config.enabled=false
server.port=8002
management.server.port=8102
shortlink.database.url=${BUSINESS_DB_URL}
shortlink.database.username=${BUSINESS_DB_USERNAME}
shortlink.database.password=${BUSINESS_DB_PASSWORD}
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=150ms
spring.data.redis.connect-timeout=1s
shortlink.internal-token=${INTERNAL_TOKEN}
shortlink.account.pii-aes-key=${ACCOUNT_PII_KEY}
shortlink.command.base-url=${COMMAND_URL:http://127.0.0.1:8001}
shortlink.analytics.base-url=${ANALYTICS_URL:http://127.0.0.1:8004}
shortlink.agent.system-username=${AGENT_SYSTEM_USERNAME}
short-link.agent.admin.internal-token=${AGENT_INTERNAL_TOKEN}
short-link.agent.admin.remote-url=${AGENT_URL:http://127.0.0.1:8010}
short-link.flow-limit.enable=false
# AdminFeignTransportConfiguration owns the production HC5 client and disables both retry layers.
# Feign's request options override HC5 connect/read defaults; bind both to the same budget.
spring.cloud.openfeign.client.config.default.connect-timeout=${shortlink.admin.transport.connect-timeout-ms}
spring.cloud.openfeign.client.config.default.read-timeout=${shortlink.admin.transport.read-timeout-ms}
shortlink.admin.transport.max-total=32
shortlink.admin.transport.max-per-route=32
shortlink.admin.transport.lease-timeout-ms=250
shortlink.admin.transport.connect-timeout-ms=1000
shortlink.admin.transport.read-timeout-ms=5000
# Keep reuse below the Command server's 2s idle connection timeout; validation cannot remove all races.
shortlink.admin.transport.keep-alive-ms=1000
shortlink.admin.transport.idle-evict-ms=1000
shortlink.admin.transport.validate-after-ms=200
shortlink.admin.transport.ttl-ms=30000
mybatis-plus.configuration.map-underscore-to-camel-case=true
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai
