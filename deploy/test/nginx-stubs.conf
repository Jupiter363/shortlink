events { worker_connections 128; }
http {
  server {
    listen 80;
    listen 8003;
    location / { return 302 https://destination.it.test/; }
  }
  server {
    listen 81;
    listen 8002;
    default_type application/json;
    location / {
      return 200 '{"stub":"management","host":"$http_host","serverPort":"$server_port","spoofedTenant":"$http_x_shortlink_tenant_id","spoofedAgent":"$http_x_agent_username","username":"$http_username","legacyUserId":"$http_userid","legacyRealName":"$http_realname","internalToken":"$http_x_internal_token","forwardedFor":"$http_x_forwarded_for","forwardedProto":"$http_x_forwarded_proto","requestId":"$http_x_request_id"}';
    }
  }
}
