name: shortlink-refactor-it
services:
  keeper:
    image: clickhouse/clickhouse-server:25.3.6.56
    entrypoint: ["clickhouse", "keeper", "--config-file=/etc/clickhouse-keeper/keeper.xml"]
    mem_limit: 256m
    volumes:
      - ./keeper.xml:/etc/clickhouse-keeper/keeper.xml:ro
  clickhouse-r1:
    image: clickhouse/clickhouse-server:25.3.6.56
    ports: ["127.0.0.1:18124:8123"]
    mem_limit: 1g
    environment:
      CLICKHOUSE_USER: shortlink_it
      CLICKHOUSE_PASSWORD: shortlink-it-only
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_DB: shortlink_replicated_it
      CLICKHOUSE_REPLICA: replica01
    volumes:
      - ./clickhouse-cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
    depends_on: [keeper]
  clickhouse-r2:
    image: clickhouse/clickhouse-server:25.3.6.56
    ports: ["127.0.0.1:18125:8123"]
    mem_limit: 1g
    environment:
      CLICKHOUSE_USER: shortlink_it
      CLICKHOUSE_PASSWORD: shortlink-it-only
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_DB: shortlink_replicated_it
      CLICKHOUSE_REPLICA: replica02
    volumes:
      - ./clickhouse-cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
    depends_on: [keeper]
