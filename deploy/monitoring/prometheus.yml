global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - alerts.yml
scrape_configs:
  - job_name: shortlink-gateway
    metrics_path: /actuator/prometheus
    scrape_timeout: 5s
    static_configs:
      - targets: ['127.0.0.1:8100']
  - job_name: shortlink-redirect
    metrics_path: /actuator/prometheus
    scrape_timeout: 5s
    static_configs:
      - targets: ['127.0.0.1:8103']
