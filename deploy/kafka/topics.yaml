# Kafka 3.9.0 topic contract. Production replication=3 / minISR=2.
# Isolated development may explicitly set replication=1 / minISR=1.
defaults:
  partitions: 24
  replication-factor: 3
  min-insync-replicas: 2
topics:
  - name: shortlink.metadata.dlq.v1
    timestamp-type: LogAppendTime
    cleanup-policy: delete
    retention-ms: 2592000000
  - name: shortlink.batch.ready.v1
    timestamp-type: LogAppendTime
    cleanup-policy: delete
    retention-ms: 604800000
  - name: shortlink.metadata.fetch.v1
    timestamp-type: LogAppendTime
    cleanup-policy: delete
    retention-ms: 604800000
  - name: shortlink.click.raw.v1
    timestamp-type: LogAppendTime
    cleanup-policy: delete
    retention-ms: 604800000
  - name: shortlink.gateway.request.v1
    timestamp-type: LogAppendTime
    cleanup-policy: delete
    retention-ms: 604800000
  - name: shortlink.click.enriched.v1
    timestamp-type: CreateTime
    cleanup-policy: delete
    retention-ms: 604800000
  - name: shortlink.request.enriched.v1
    timestamp-type: CreateTime
    cleanup-policy: delete
    retention-ms: 604800000
  - name: shortlink.stats.5m.v1
    timestamp-type: CreateTime
    cleanup-policy: delete
    retention-ms: 604800000
  - name: shortlink.risk.signal.v1
    timestamp-type: CreateTime
    cleanup-policy: delete
    retention-ms: 604800000
  - name: shortlink.route.change.v1
    timestamp-type: LogAppendTime
    cleanup-policy: delete
    retention-ms: 604800000
  # Membership hints accelerate the authoritative registry reader; they are not coverage proof.
  - name: shortlink.route.membership.v1
    timestamp-type: LogAppendTime
    cleanup-policy: delete
    retention-ms: 604800000
  - name: shortlink.risk.policy.change.v1
    timestamp-type: LogAppendTime
    cleanup-policy: delete
    retention-ms: 604800000
  - name: shortlink.click.late.v1
    timestamp-type: LogAppendTime
    cleanup-policy: delete
    retention-ms: 2592000000
  - name: shortlink.click.dlq.v1
    timestamp-type: LogAppendTime
    cleanup-policy: delete
    retention-ms: 2592000000
